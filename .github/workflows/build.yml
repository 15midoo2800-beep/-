name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Configure Android Project, Brand Name & Share Filters
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name rased

          # 1. ضبط إصدار كوتلن بدقة إلى 1.9.22
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          fi

          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          fi

          # 2. ضبط minSdkVersion إلى 21
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true

          # 3. تثبيت اسم التطبيق الرسمي ليكون "رصد"
          sed -i 's/android:label="[^"]*"/android:label="رصد"/g' android/app/src/main/AndroidManifest.xml

          # 4. إضافة أذونات الصوت، الإنترنت، الـ GPS، وحفظ الملفات
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # 5. إضافة دعم استقبال ومشاركة ملفات الإكسيل (Open with + Share to)
          sed -i '/<\/activity>/i \        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <action android:name="android.intent.action.SEND" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />\n            <data android:mimeType="application/vnd.ms-excel" />\n            <data android:mimeType="text/comma-separated-values" />\n            <data android:mimeType="text/csv" />\n            <data android:mimeType="application/octet-stream" />\n            <data android:mimeType="*/*" />\n        </intent-filter>' android/app/src/main/AndroidManifest.xml

          # 6. رسم وحقن أيقونة الرادار الأصلية
          python3 -c "
          import os, zlib, struct, math

          width, height = 256, 256
          raw_data = bytearray()
          cx, cy = 128, 128

          for y in range(height):
              raw_data.append(0)
              for x in range(width):
                  dx = x - cx
                  dy = y - cy
                  dist = math.hypot(dx, dy)
                  angle = math.atan2(dy, dx)

                  if dist > 120:
                      raw_data.extend([0, 0, 0, 0])
                  else:
                      r, g, b = 11, 19, 43
                      if abs(dist - 110) < 4:
                          r, g, b = 6, 214, 160
                      elif abs(dist - 80) < 3 or abs(dist - 52) < 3 or abs(dist - 25) < 3:
                          r, g, b = 6, 214, 160
                      elif dist < 12:
                          r, g, b = 6, 214, 160
                      elif -0.8 < angle < 0.2 and dist < 105:
                          factor = (1.0 - (dist / 115.0)) * 0.7
                          r = int(11 + (6 - 11) * factor)
                          g = int(19 + (214 - 19) * factor)
                          b = int(43 + (160 - 43) * factor)

                      raw_data.extend([r, g, b, 255])

          def chunk(tag, data):
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', (256).to_bytes(4, 'big') + (256).to_bytes(4, 'big') + b'\x08\x06\x00\x00\x00') + chunk(b'IDAT', zlib.compress(bytes(raw_data))) + chunk(b'IEND', b'')

          folders = ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']
          for f in folders:
              p = os.path.join('android/app/src/main/res', f)
              os.makedirs(p, exist_ok=True)
              with open(os.path.join(p, 'ic_launcher.png'), 'wb') as icon_file:
                  icon_file.write(png)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Obfuscated APK (تشفير الكود)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rased-app
          path: build/app/outputs/flutter-apk/app-release.apk
