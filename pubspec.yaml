name: sheekha
description: "Sheekha field plate recognition and voice scanner app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  speech_to_text: ^6.6.0
  
  # إصدارات مستقرة متوافقة مع Kotlin 1.7.1 الموجود في السيرفر بدون أخطاء
  permission_handler: 10.4.5
  file_picker: 5.5.0
  excel: ^4.0.2
  geolocator: 9.0.2
  url_launcher: 6.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
